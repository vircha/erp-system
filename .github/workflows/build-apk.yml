name: Build Android APK

# 打 v* 标签（如 v5.6.5）自动构建 APK 并建 GitHub Release；也支持手动触发。
#
# 🔴 公开仓库默认产出的是「演示包」：
#    连的是占位域名 https://erp.example.com，装得上、能看界面，
#    但**连不上任何真实服务器**。它的价值是验证「代码能编译、CI 链路通」。
#
# 🔴🔴 为什么 CI 不产正式包（这一点很关键，别"优化"掉）：
#    Release 里的 APK 是**任何人可下载**的。而 APK 里必然带着服务器地址
#    （BuildConfig.API_BASE）。就算用 Secret 藏起来，构建时也会被打进包里，
#    别人下载 APK 解包就能读出来 —— 那脱敏就白做了。
#    所以正式包一律由仓库所有者在**本机**用 build-apk.sh 出。
#
# 私有仓库若想走 CI 出正式包，可以配这几个 Secret：
#   ERP_API_BASE / ANDROID_KEYSTORE_BASE64 /
#   ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD
# 下面的逻辑仍然支持这条路（配了就走 release 签名包）。
#
# 🔴 关于占位域名：源码里入库的就是 https://erp.example.com，
#    正常构建会被 settings.gradle 直接中断（防止把占位域名打进生产 APK）。
#    只有显式加 -PerpAllowExampleHost=true 才放行，这里就是给演示包用的。
#
# 🔴 两个已在 CI 上真实踩过的坑（别删对应防护）：
#    ① .gitignore 的 *.png 吞掉 25 个应用图标 → AAPT resource not found
#    ② .gitignore 的 data/ 吞掉 4 个 .kt 源码包 → Kotlin Unresolved reference
#    两者本机都构建得过（文件在磁盘上），只有 CI 检出后才暴露。
#    下面的"资源自检"步骤就是拦这类问题的。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      # JDK 21 与生产构建保持一致（CHANGELOG 记载 JDK 17 曾报「无效的目标发行版」）
      - name: 配置 JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: 配置 Gradle 缓存
        uses: gradle/actions/setup-gradle@v3

      - name: 写入服务器地址
        working-directory: ./android-native
        env:
          ERP_API_BASE: ${{ secrets.ERP_API_BASE }}
        run: |
          if [ -n "$ERP_API_BASE" ]; then
            echo "erpApiBase=$ERP_API_BASE" > local.properties
            echo "::notice::已使用仓库 Secret 中配置的服务器地址（私有仓库路径）"
          else
            echo "erpApiBase=https://erp.example.com" > local.properties
            echo "::notice::未配置 ERP_API_BASE —— 按设计构建演示包。公开仓库就该这样，不是错误。要能用的包请在本机跑 build-apk.sh。"
          fi

      # 有 keystore secret 就出正式签名包；没有就退回 debug 签名
      - name: 准备签名密钥
        id: ks
        working-directory: ./android-native
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KS_KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KS_B64" ]; then
            echo "has_ks=false" >> "$GITHUB_OUTPUT"
            echo "::notice::未配置 ANDROID_KEYSTORE_BASE64，release 构建将回退 debug 签名"
            exit 0
          fi
          # 🔴 四个值缺一不可：只配了密钥文件却没配口令，会构建出一个签不上名、
          #    或者用空口令签名的包，比直接退回 debug 签名更危险。
          if [ -z "$KS_PASS" ] || [ -z "$KS_ALIAS" ] || [ -z "$KS_KEY_PASS" ]; then
            echo "::error::配了 ANDROID_KEYSTORE_BASE64，但ANDROID_KEYSTORE_PASSWORD / ANDROID_KEY_ALIAS / ANDROID_KEY_PASSWORD 有缺失。四个必须同时配置。"
            exit 1
          fi
          printf '%s' "$KS_B64" | base64 -d > release-key.jks
          cat > keystore.properties <<EOF
          storeFile=release-key.jks
          storePassword=$KS_PASS
          keyAlias=$KS_ALIAS
          keyPassword=$KS_KEY_PASS
          EOF
          echo "has_ks=true" >> "$GITHUB_OUTPUT"

      - name: 资源自检（拦截「本地过、CI 挂」）
        working-directory: ./android-native
        run: |
          # 🔴 .gitignore 的 *.png 一旦误伤 res/ 图标，本机gradle 能过、
          #    但 CI 检出后没有这些文件，AAPT 会报
          #    「resource drawable/ic_launcher_background not found」。
          #    提前在这里报错，日志比 AAPT 的报错友好得多。
          node scripts/check-res.mjs

      - name: 构建 APK
        working-directory: ./android-native
        env:
          HAS_KS: ${{ steps.ks.outputs.has_ks }}
        run: |
          chmod +x ./gradlew
          if [ "$HAS_KS" = "true" ]; then
            ./gradlew assembleRelease --no-daemon
          else
            # 演示包：显式放行占位域名（settings.gradle 默认会拒绝）
            ./gradlew assembleDebug --no-daemon -PerpAllowExampleHost=true
          fi

      - name: 收集产物并读取版本号
        id: art
        working-directory: ./android-native
        env:
          HAS_KS: ${{ steps.ks.outputs.has_ks }}
        run: |
          if [ "$HAS_KS" = "true" ]; then
            SRC=app/build/outputs/apk/release
          else
            SRC=app/build/outputs/apk/debug
          fi
          APK=$(find "$SRC" -name '*.apk' | head -1)
          if [ -z "$APK" ]; then
            echo "::error::构建成功但没找到 APK（查找路径：$SRC）"
            exit 1
          fi
          cp "$APK" ../erp-app.apk
          ls -lh ../erp-app.apk

          #🔴 提取到产物路径并验证构建期保险真的生效：
          #   正式签名包绝不能含占位域名，否则等于发一个连不上服务器的版本。
          if [ "$HAS_KS" = "true" ]; then
            if unzip -p ../erp-app.apk 'classes*.dex' 2>/dev/null | strings | grep -q 'example\.com'; then
              echo "::error::正式包内检出占位域名 example.com，说明服务器地址没配对，已中止发布"
              exit 1
            fi
            echo "::notice::正式包域名校验通过（不含 example.com）"
          fi

          VC=$(grep -m1 "versionCode" app/build.gradle | grep -oE '[0-9]+')
          VN=$(grep -m1 "versionName" app/build.gradle | sed "s/.*versionName *//;s/['\"]//g")
          echo "vc=$VC" >> "$GITHUB_OUTPUT"
          echo "vn=$VN" >> "$GITHUB_OUTPUT"

      - name: 创建 Release 并上传 APK
        uses: softprops/action-gh-release@v2
        env:
          HAS_KS: ${{ steps.ks.outputs.has_ks }}
        with:
          name: v${{ steps.art.outputs.vn }}（versionCode ${{ steps.art.outputs.vc }}）
          body: |
            自动构建产物：versionName `${{ steps.art.outputs.vn }}` / versionCode `${{ steps.art.outputs.vc }}`

            ${{ env.HAS_KS == 'true' && '✅ **正式签名包** —— 使用仓库 Secret 中的签名密钥，可覆盖安装线上版本。' || '⚠️ **演示包** —— Android 自动 debug 签名，装得上能跑，但连的是占位域名 `erp.example.com`，**连不上任何真实服务器**。仅供验证界面与功能，不能当正式版用。' }}

            **要能正常用的包，请在本机出：**

            ```bash
            cp build.local.env.example build.local.env   # 填真实地址 + 签名
            ./build-apk.sh
            ```

            详见 README「手机版」一节。之所以不在 CI 出正式包：Release 里的 APK
            谁都能下载，而 APK 必然带着服务器地址，等于把地址公开了。
          files: erp-app.apk