name: Publish Docker Image

# ============================================================
# 构建并推送 Docker 镜像到 GitHub Container Registry (GHCR)
# ============================================================
# 产出：ghcr.io/vircha/erp-system
#
# 🔴 权限从哪来 —— **不需要给仓库配置任何 Secret，也不碰你的 PAT**
#   这里用的是 Actions **内置**的 GITHUB_TOKEN，它自带 packages: write。
#   （正式包 APK 之所以要另配Secret，是因为 APK 里含真实域名，
#     而镜像是从公开源码构建的，不含任何私有信息。）
#
# 🔴 触发时机刻意只认 v* 标签，不认main 推送：
#   镜像会被人 docker pull 长期使用，相当于对外发布一个 API 契约。
#   「改了 main 就自动换 latest」意味着某次普通改动会让所有人立刻拿到新镜像，
#   一旦有 breaking change（改了 .env 变量名、删了 API），
#   别人 pull 到的是坏的，而他自己本地 build 的还是好的 —— 极难排查。
#   所以latest 只在打标签时更新。想验证「能不能构建」用下面的 verify job。
#
# 🔴 手动触发（workflow_dispatch）只跑 verify，不推镜像 ——
#   推送必须走标签，这是刻意的闸门，别去掉。

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  pull_request:
    paths:
      - 'Dockerfile'
      - 'docker-compose.yml'
      - '.dockerignore'
      - 'server.js'
      - 'db.js'
      - 'moderation.js'
      - 'moderation_server.js'
      - 'order_table.js'
      - 'xlsx_util.js'
      - 'package.json'
      - 'public/**'

# 🔴🔴 顶层权限必须写成 read起步、按 job 提权
#   GitHub 曾经把新仓库的默认 GITHUB_TOKEN 改成只读，
#   那样这里的 push 会报 "403 Resource not accessible by integration"。
#   只读 + 按需 packages: write 是最小权限的正确写法。
permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # ------------------------------------------------------------
  # 1) 验证：构建 + 真的把容器跑起来 + 真的能登录
  # ------------------------------------------------------------
  #🔴 这不是「多此一举的重复构建」，它是唯一能证明 Dockerfile 可用的手段。
  #   Dockerfile 里已经做了 node:sqlite 的import 实测（挡住基础镜像不带模块），
  #   但那只证明「模块能加载」。真正会炸的是这些：
  #     · 数据库目录不可写 → SQLite CANTOPEN
  #     · 建表 SQL 有语法错→ 首次建库即崩
  #     · 静态资源没进镜像 → 页面全 404 白屏（过一次"API 正常"的测试）
  #   全部要「容器真起来 + 真发请求」才暴露。
  verify:
    name: 构建并冒烟测试
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      # 不 --load：用 buildx 的缓存跑一遍全部 Dockerfile 指令（含 node:sqlite 实测）
      - name: 构建（不推送）
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: erp-system:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 起容器
        run: |
          # 用一次性口令起服务。deploy.sh 会拦住默认弱口令，
          # 但这里只跑几十秒的冒烟测试，不对外暴露端口，无需强口令。
          docker run -d --name erp-ci \
            -e ERP_BOSS_USERNAME=ci \
            -e ERP_BOSS_PASSWORD='Ci-Only-Throwaway-9x2' \
            -p 3000:3000 \
            erp-system:ci

      - name: 等待就绪
        run: |
          for i in $(seq 1 30); do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/me || true)
            # 未登录时 /api/me 返 401，说明 HTTP 链路 + 路由 + 数据库都活着
            if [ "$code" = "401" ]; then echo "✓ 就绪（401 = 鉴权正常）"; exit 0; fi
            if ! docker ps --format '{{.Names}}' | grep -qx erp-ci; then
              echo "✗ 容器已退出，日志："; docker logs erp-ci; exit 1
            fi
            sleep 2
          done
          echo "✗ 60 秒未就绪，日志："; docker logs --tail 50 erp-ci; exit 1

      - name: 冒烟测试：登录 + 数据库可写
        run: |
          set -euo pipefail
          # 🔴 不能只测「API 返回 200」。真正要验的是**写路径**：
          #   首次建库会跑一整套CREATE TABLE，任何一条 SQL 语法错都只在建库时暴露，
          #   光 GET 请求全绿说明不了任何问题。
          TOKEN=$(curl -s -X POST http://127.0.0.1:3000/api/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"Ci-Only-Throwaway-9x2"}' \
            | python3 -c 'import sys,json; print(json.load(sys.stdin).get("token",""))')
          if [ -z "$TOKEN" ]; then
            echo "✗ 登录失败 —— 首次建库或账号创建有问题"; docker logs --tail 50 erp-ci; exit 1
          fi
          echo "✓ 登录成功，建库与账号创建正常"

          # 建一张套账：验证写路径（表结构 + 事务）
          curl -sf -X POST http://127.0.0.1:3000/api/books \
            -H 'Content-Type: application/json' -H "Authorization: Bearer $TOKEN" \
            -d '{"name":"CI冒烟套账"}' | python3 -c 'import sys,json; d=json.load(sys.stdin); print("✓ 写入成功 book_id=", d.get("id"))'

      - name: 冒烟测试：静态资源不是 404
        run: |
          set -euo pipefail
          # 🔴🔴 这条是专门为「API 全绿但页面白屏」加的。
          #   历史上就踩过：前端资产没进镜像（或路径写错），
          #   所有 API 正常返回 200，页面却一片空白 —— 极难定位。
          for f in / /index.html /css/style.css /js/app.js /sw.js; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:3000$f")
            if [ "$code" != "200" ]; then
              echo "✗ 静态资源 $f 返回 $code（期望 200）—— 页面会白屏"
              exit 1
            fi
          done
          echo "✓ 静态资源齐全"

      - name: 容器健康状态
        if: always()
        run: docker logs --tail 40 erp-ci || true

      - name: 清理
        if: always()
        run: docker rm -f erp-ci || true

  # ------------------------------------------------------------
  # 2) 推送：只在打了 v* 标签时执行
  # ------------------------------------------------------------
  publish:
    name: 推送到 GHCR
    # 🔴 必须等 verify 通过：冒烟测试没过绝不推。
    #    （注意注释的 # 前必须留一个空格，`needs: verify# x` 会被 YAML
    #    解析成字符串 "verify# x"，GitHub 报「Invalid workflow file」，
    #     报错信息完全不指向真正原因。）
    needs: verify
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # 🔴 只有这个 job 有推送权
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 🔴🔴 packages: write 默认**不包含删除包**的权限。
      #   不显式声明 delete-package，GHCR 上会堆积一堆历史 tag（v5.6.6、v5.6.7...），
      #   每个都占存储，且别人 pull 时会误拉到旧版本。
      - name: 取得镜像 token
        id: token
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          logout: true

      - name: 计算标签
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
          # 🔴 不加 type=sha —— 会多出 sha-xxxxx 这种标签，
          #   标签列表一片混乱，而这类镜像没人按 commit 取。

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            ERP_VERSION=${{ steps.meta.outputs.version }}
            VCS_REF=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
          # 🔴 多架构：ARM 软路由 / 云服务器常见 ARM（家里那台 C 软路由就是），
          #   只出 amd64 等于把一整类用户排除在外。
          #   qemu 让单台 x86 runner 能编 ARM 镜像，代价是慢几倍，对本项目（零依赖、几十 MB）可接受。
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 输出摘要
        run: |
          echo "### 镜像已发布" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.meta.outputs.tags }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '拉取方式：' >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull $IMAGE:\${{ steps.meta.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo '⚠️ 本仓库的镜像默认是**私有**。别人 docker pull 会收到 unauthorized，' >> "$GITHUB_STEP_SUMMARY"
          echo '需要在仓库的 Package settings 里把 erp-system 改成 Public。' >> "$GITHUB_STEP_SUMMARY"

# 📌 如果以后想让镜像默认公开，最省事的做法是加一个 package 权限配置文件
#   （放 .github/ 下，叫 settings.yml 或类似，需按仓库实际约定），
#   或直接在网页上把 visibility 改一次 —— 后者更快且不易写错。
# 📌 首次发布后必做：把 GHCR 包设为Public，否则 README 里的 docker pull 命令对
#   所有外部人都是 unauthorized —— 这是最容易忘、也最让人困惑的一步。