org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# 🔴 服务器地址（打包进 App 的 API_BASE）—— 生产环境真实地址，勿改回占位符。
#    2026-10-17 修复：这里曾是 Gradle 模板占位符 https://erp.example.com（域名不存在），
#    导致所有新构建的 APK 全部无法登录。发布前必须确认本行不是 example.com。
#    服务端口只监听本机，必须走域名经 nginx 反代 /api/ 与 /downloads/。
erpApiBase=https://erp.example.com
