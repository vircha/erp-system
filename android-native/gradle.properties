org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
kotlin.code.style=official
android.nonTransitiveRClass=true

# ============================================================================
# 🔴🔴 这里**必须**保持占位符 https://erp.example.com —— 不要改成真实域名！
# ============================================================================
#
# 为什么：
#   本文件是**要入库**的。写了真实域名，任何人 clone 一下就知道服务器在哪，
#   整个脱敏工作就白做了。
#
# 真实地址怎么进去 —— 走「本机注入」，不进仓库：
#
#     cp build.local.env.example build.local.env   # 填真实地址 + 签名
#     ./build-apk.sh                               # 一键出包
#
#   脚本会写 android-native/local.properties（已 gitignore），
#   settings.gradle 从那里读真地址，校验后交给 build.gradle 打进 BuildConfig.API_BASE。
#
# 🔴 直接跑 ./gradlew assembleRelease 会怎样：
#   settings.gradle 发现地址还是占位符，**直接中断构建**并提示怎么配。
#   这是故意的 —— 宁可构建失败，也不要悄悄把一个连不上服务器的包发出去。
#   （历史上吃过这个亏：settings 校验通过、APK 里却打进占位域名，
#     装到真机才报「连不上服务器」，用户完全不知道原因。）
#
# 唯一允许占位符出包的情况：CI 构建**演示包**时显式加 -PerpAllowExampleHost=true。
# ============================================================================
erpApiBase=https://erp.example.com
