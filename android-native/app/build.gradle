import java.util.Properties

plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.heping.erpnative'
    compileSdk 34

    defaultConfig {
        applicationId 'com.heping.erpnative'
        minSdk 24
        targetSdk 34
        // 🔴 v4.7 起改走HTTPS。之前是明文 HTTP，Manifest 里开了
        //   usesCleartextTraffic="true" —— 登录密码、订单金额在公网明文传输，
        //   同一个 WiFi 下可被直接抓包窃听。
        //   ⚠️ 若你的服务器还没配好 HTTPS 证书，临时改回 http 并放开明文流量，
        //      但务必尽快上证书。
        // 👉 部署时改这里，或在根目录放local.properties 里用 apiBase 覆盖（见 gradle.properties 说明）。
        // 🔴 v5.7.3：APK 下载改走**永久短链** /downloads/apk（服务器实时 302 到当时最新版）。
        //   旧版 App 内存里缓存的 updateInfo.url 是带版本号的 R2 预签名直链 → 永久指向旧包，
        //   这是经理反馈「移动版从浏览器下载下到旧版本」的根因。详见 SettingsScreen.kt 注释。
        // 🔴 v5.7.7：放开「退货订单无法编辑」—— 订单行/详情弹窗的编辑入口不再排除 status='returned'；
        //   复制退货单按原样复制成退货单（qty 取绝对值 + type='return'），不再变成销售单。
        // 🔴 v5.7.8：退货金额与折扣按**历史**取价（服务端对全部 4 条退货路径强制执行：
        //   手工退货单 / 整张退货 / 部分退货 / 编辑退货单，报文里的 price、discount 一律忽略），
        //   折前价取自原单快照（快照缺失则回退门店历史价 customer_prices.price）。
        //   网页版与手机端同步把「单价 / 单品折扣」在退货模式下改为只读，避免改了没反应的假入口；
        //   整单折扣仍可手填（那是「协商让利」的口子，与行级历史价不冲突）。
        // 🔴 v5.7.9：小票数字「6 / 8」难辨识改造（经理 2026-10-29 报修）。
        //   根因：ESC/POS 内置 Font A = 12×24 点阵，「8」与「6」的差异只有右上角那一小段，
        //   48 列小票上数字区密集排布 → 快速扫视时容易串读。
        //   对策（三招同时上，网页版 / 手机版预览 / 蓝牙实打印 6 个出口全部同步）：
        //     ① 数字区加竖线分区：名称区 | 数量 原价 特价 | 金额 —— 不串列；
        //     ② 数字区整块加粗（ESC E 1）→ 竖笔画由 1 点变 2 点；
        //     ③ 合计「优惠后金额」用 GS ! 0x01 倍宽（宽×2、高×1，每字符占 2 列）。
        //   版式：LEFT_W(18) + "|"(1) + 数量(6) + 原价(7) + 特价(7) + "|"(1) + 金额(8) = 48 ✓
        //   同时修掉「App 预览图还是旧 3 列、与实打印不一致」的历史 bug。
        versionCode 67
        versionName "5.7.9"
        vectorDrawables { useSupportLibrary true }
        // 服务器地址：由 settings.gradle 解析并校验（占位符/非 https 会直接中断构建）。
        //   🔴 必须读 gradle.ext.erpApiBase，**不能写 rootProject.ext.erpApiBase** ——
        //   后者会退化成 gradle.properties 里的同名 project property（占位符），
        //   导致「settings 校验通过、APK 却打进占位域名」这种最坏情况（2026-10-19 修复）。
        //   这里的断言是第二道保险：即使 settings 被绕过，也在打包点再拦一次。
        if (!gradle.ext.has('erpApiBase')) throw new GradleException(
            "\n🔴 gradle.ext.erpApiBase 缺失 —— settings.gradle 未正确执行，构建中止。\n")
        def __apiBase = gradle.ext.erpApiBase.toString().trim()
        def __allowExample = (project.hasProperty('erpAllowExampleHost')
                               && project.erpAllowExampleHost.toString() == 'true')
        if (__apiBase.contains('example.com') && !__allowExample) throw new GradleException(
            "\n🔴 即将把占位域名打进 APK：${__apiBase}\n" +
            "   example.com 不存在，App 会完全无法登录。构建已中止。\n")
        logger.lifecycle("[erp]打包服务器地址 = ${__apiBase}")
        buildConfigField 'String', 'API_BASE', "\"${__apiBase}\""
        // 只打包真机 ABI：x86/x86_64 是模拟器用的，真机永远用不到。
        // ML Kit OCR 的 .so 每份约 6~10MB 且几乎不压缩，去掉 x86/x86_64 直接省约 21MB。
        // v4.4 进一步只留 arm64-v8a：2017 年以后出厂的安卓机(含所有门店机)均支持，再省约 5.9MB。
        ndk { abiFilters 'arm64-v8a' }
    }

    // 🔴 签名配置：**凭据一律不写进源码**。
    //    在工程根目录建一个 keystore.properties（已被 .gitignore 排除）填自己的密钥：
    //      storeFile=C:/path/to/your-release-key.jks
    //      storePassword=你的密钥库密码
    //      keyAlias=你的别名
    //      keyPassword=你的别名密码
    //    文件不存在时自动回退到 Android 默认 debug 签名，
    //    这样任何人 clone 下来都能直接编译，只是不能上架应用商店。
    signingConfigs {
        release {
            def ksPropsFile = rootProject.file('keystore.properties')
            if (ksPropsFile.exists()) {
                def ksProps = new Properties()
                ksProps.load(new FileInputStream(ksPropsFile))
                storeFile     file(ksProps['storeFile'])
                storePassword ksProps['storePassword']
                keyAlias      ksProps['keyAlias']
                keyPassword   ksProps['keyPassword']
            } else {
                logger.lifecycle('[signing]未找到 keystore.properties，release 构建回退到 debug 签名（仅供本地编译/内测，不可上架）')
                storeFile     file("${System.getProperty('user.home')}/.android/debug.keystore")
                storePassword 'android'
                keyAlias      'androiddebugkey'
                keyPassword   'android'
            }
        }
    }

    buildTypes {
        release {
            // 🔴 v5.7.2（2026-10-22 经理「优化网页版及手机版加载速度」）：开 R8。
            //   实测 minifyEnabled=false 时 **3 个 dex 合计 45.6 MB**（classes.dex 27.5MB
            //   + classes2.dex 9.9MB + classes3.dex 8.2MB），比全部原生so 库（14.3MB）
            //   还大 3 倍 —— 因为 R8 没跑，所有用不到的类（material-icons-extended
            //   打包了几千个图标矢量、Compose/MLKit 的测试与调试代码）全塞进了 dex。
            //   APK 32MB 意味着门店手机每次「检查更新」都要下载 32MB。
            //   开 R8 后：① 混淆+去垃圾，dex 通常降到 1/3~1/4；② 配合
            //   shrinkResources 删掉用不到的 res；③ KSP/注解索引更小，类加载更快。
            //
            // 🔴 铁律：混淆会改类名，Gson 靠反射解析 Models.kt 的数据类 →
            //    **必须保留类名与字段名**，否则所有接口反序列化全变 null（页面全是空表格）。
            //    这条规则已写进 proguard-rules.pro，不是可选的。
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            signingConfig signingConfigs.release

            //🔴 R8 会删掉「只被反射调用」的类。如需自检，看这份报告：
            //   app/build/outputs/mapping/release/missing_rules.txt
            //   以及 usage.txt（列出了被判定为未使用的类），逐条确认后再补keep。
        }
        debug {
            // 🔴 debug 必须用自己的默认 debug 签名，不要复用 release。
            //    两者共用签名会让 debug 包能覆盖安装正式包，等于把生产签名降级暴露给所有人。
            //    （原代码此处误用 signingConfigs.release，已修正。）
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }

    buildFeatures {
        compose true
        buildConfig true
    }
    composeOptions {
        kotlinCompilerExtensionVersion '1.5.14'
    }
    packagingOptions {
        resources {
            excludes += '/META-INF/{AL2.0,LGPL2.1}'
        }
    }
}

// 🔴🔴 资源自检：拦住「本地能过、CI 失败」的坑（2026-10-19 真实事故）
//
//   .gitignore 里的 *.png 曾把 25 个应用图标（drawable-*/mipmap-*）全部排除。
//   本机 assembleRelease 照常成功（文件在磁盘上），
//   但 GitHub Actions 检出仓库后没有这些文件，直接报：
//     AAPT: error: resource drawable/ic_launcher_background not found
//
//   挂到 preBuild 上，让任何构建入口（本地 / CI / 手动 gradlew）都先过这道关。
tasks.register('checkRes') {
    description = '校验 Android res 资源完整性（引用是否存在、是否被 gitignore 吞掉）'
    group = 'verification'
    doLast {
        def script = file("${rootDir}/scripts/check-res.mjs")
        if (!script.exists()) {
            throw new GradleException("找不到资源自检脚本：${script}")
        }
        def stdout = new ByteArrayOutputStream()
        def stderr = new ByteArrayOutputStream()
        def result = exec {
            commandLine 'node', script.absolutePath
            workingDir rootDir
            standardOutput = stdout
            errorOutput = stderr
            ignoreExitValue = true
        }
        def out = stdout.toString('UTF-8')
        def err = stderr.toString('UTF-8')
        if (out.trim()) logger.lifecycle(out.trim())
        if (result.exitValue != 0) {
            // 前置检查失败时 Gradle 自己的报错很啰嗦，这里直接把根因顶出来
            throw new GradleException(
                "\n🔴 资源自检未通过，构建已中止。\n" +
                (err ?: out).trim() +
                "\n（典型原因：.gitignore 的 *.png 误伤了 res/ 下的图标，" +
                "本机能过但 CI 检出会失败）\n")
        }
    }
}

tasks.named('preBuild') {
    dependsOn 'checkRes'
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.lifecycle:lifecycle-runtime-ktx:2.7.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.7.0'
    implementation 'androidx.activity:activity-compose:1.9.0'

    implementation platform('androidx.compose:compose-bom:2024.06.00')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.ui:ui-graphics'
    implementation 'androidx.compose.ui:ui-tooling-preview'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-extended'
    debugImplementation 'androidx.compose.ui:ui-tooling'

    implementation 'androidx.navigation:navigation-compose:2.7.7'

    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.google.code.gson:gson:2.10.1'

    implementation 'androidx.datastore:datastore-preferences:1.1.1'
    implementation 'com.caverock:androidsvg:1.4'

    // ML Kit 中文文字识别（bundled 模型，离线可用，无需 Google Play 服务）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.0'
    // ML Kit 条码扫描（bundled，离线可用）：扫码枪扫商品条码 / 扫纸质单据上的单号
    implementation 'com.google.mlkit:barcode-scanning:17.3.0'
    // CameraX 取景（扫码用）
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    implementation 'androidx.camera:camera-view:1.3.4'
}
